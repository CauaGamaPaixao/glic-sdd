schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projeto: GLIC Estudos — agenda de atividades acadêmicas (trabalhos, provas, entregas).
  Grupo (GLIC): Cauã, Lucas Lima, Giovanna Oliveira, Giovanna Pina, Cintia, Igor Ruy.
  Stack: React 19 + Vite (JavaScript, sem TypeScript), fetch nativo, CSS puro.
  Estrutura obrigatória de pastas: src/api (clientes HTTP), src/components (componentes), src/pages (páginas).
  API: JSON Server 0.17 em http://localhost:3001 servindo db.json (npm run api). O db.json é o contrato de dados.
  Sem bibliotecas extras de UI, formulário, roteamento ou estado.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
